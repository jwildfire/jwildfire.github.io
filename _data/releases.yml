# Release feed for the homepage "News" timeline (_layouts/home.html).
#
# One entry per published release, newest first (order here does not matter —
# the layout sorts by date). Each renders as a single compact line:
#   package version — blurb · Notes · Demo
#
# Fields:
#   package  short package name as it should read on the page
#   version  tag, including the leading "v"
#   date     publication date (YYYY-MM-DD)
#   blurb    one sentence, functionality first, no trailing period needed
#   links    label + url; first two are conventionally Notes and Demo, a third
#            (e.g. an annotated walkthrough) is fine but keep it to three
#
# Currently limited to safety.viz and gsm.safety. Other obot packages can be
# added later without touching the layout.

