# Key projects. `stub` is the one-line version used on the homepage list;
# `blurb` is the long version used on /projects/. Order here is page order.
# `url` is where the card's thumbnail and name link; `thumb` is a screenshot in
# assets/img/projects/ (800x500).
- name: "{gsm}"
  url: "https://gilead-biostats.github.io/gsm.core/"
  thumb: "/assets/img/projects/gsm.jpg"
  alt: "A gsm study overview report: a table of sites with red and amber flags across key risk indicators"
  role: "Creator · Technical lead, Gilead RBQM · 2022 – present"
  stub: "Open-source R framework for risk-based quality monitoring, approved for GxP use."
  blurb: >-
    An open-source R framework for risk-based quality monitoring, designed for GxP
    from the first commit. Approved for GxP use and running monitoring oversight on
    more than 15 active studies, with a surrounding toolchain that turns validation
    evidence into a build artifact instead of a document nobody reads.
  links:
    - label: "Docs"
      url: "https://gilead-biostats.github.io/gsm.core/"
    - label: "GitHub"
      url: "https://github.com/Gilead-BioStats/gsm.core"
    - label: "Paper"
      url: "https://link.springer.com/article/10.1007/s43441-024-00651-4"

- name: "safety.viz"
  url: "https://jwildfire.github.io/safety.viz/"
  thumb: "/assets/img/projects/safety-viz.jpg"
  alt: "The safety.viz gallery: cards for the Safety Histogram, Safety Outlier Explorer and Safety Results Over Time"
  role: "Creator · 2026 · JavaScript"
  stub: "Thirteen interactive clinical safety charts, with published test evidence."
  blurb: >-
    A charting library for monitoring clinical trial safety: thirteen interactive
    charts, from safety histograms to the eDISH hepatic explorer, the nephrotoxicity
    explorer and the QT safety explorer. Every chart traces to a reviewed requirement
    matrix, with more than 1,400 unit tests and 260 browser tests published as
    audit-style evidence — so "is it validated?" is now a link.
  links:
    - label: "Live demos"
      url: "https://jwildfire.github.io/safety.viz/"
    - label: "GitHub"
      url: "https://github.com/jwildfire/safety.viz"
    - label: "Evidence"
      url: "https://jwildfire.github.io/safety.viz/histogram/evidence.html"

- name: "{safetyGraphics}"
  url: "https://jwildfire.shinyapps.io/safetyGraphics/"
  thumb: "/assets/img/projects/safetygraphics.jpg"
  alt: "The safetyGraphics Shiny app showing the Hepatic Safety Explorer scatter plot of ALT against bilirubin"
  role: "Founding technical lead · ASA-DIA Interactive Safety Graphics"
  stub: "Interactive safety review for clinical trials, in R and Shiny."
  blurb: >-
    The open-source R/Shiny app that replaced the impenetrable safety appendix with
    charts a clinician can actually click. Built over five years by clinicians and
    technical contributors from more than two dozen organizations, and presented at the
    FDA Innovation Forum in 2019.
  links:
    - label: "Website"
      url: "https://safetygraphics.github.io/safetyGraphics/"
    - label: "Demo app"
      url: "https://jwildfire.shinyapps.io/safetyGraphics/"
    - label: "GitHub"
      url: "https://github.com/SafetyGraphics/safetyGraphics"
