# Keeps the homepage release feed (_data/releases.yml) in step with GitHub
# releases of the tracked packages (see scripts/sync-releases.mjs). Runs nightly
# and on demand; when something is missing it commits the new entries straight
# to main, so a release shows on the site within a day with no pull request to
# merge. The blurb is drafted from the release notes' first sentence: edit
# _data/releases.yml on main to change one after it posts.

name: Sync release feed

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add missing releases to the feed
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: SYNC_RELEASES_SUMMARY="$GITHUB_STEP_SUMMARY" node scripts/sync-releases.mjs

      - name: Commit the new entries to main
        if: steps.sync.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898276+github-actions[bot]@users.noreply.github.com"
          git add _data/releases.yml
          git commit -m "Release feed: add ${{ steps.sync.outputs.count }} new release(s)"
          git pull --rebase origin main
          git push origin HEAD:main

      # A push made with GITHUB_TOKEN may not start the Pages build on its own,
      # so ask for one. Harmless if a build is already running.
      - name: Rebuild the site
        if: steps.sync.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
