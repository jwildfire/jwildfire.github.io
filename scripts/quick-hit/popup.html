<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick hit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="kicker"><span class="ico" aria-hidden="true"></span>Quick hit</span>
    <a class="settings" href="options.html" target="_blank" title="Settings">Settings</a>
  </header>

  <p class="setup" id="setup" hidden>Add a GitHub token in <a href="options.html" target="_blank">Settings</a> to publish.</p>

  <form id="form" autocomplete="off">
    <label class="field">
      <span class="lab">Comment</span>
      <textarea id="comment" rows="4" placeholder="Why it's worth reading. Markdown works."></textarea>
    </label>

    <label class="field">
      <span class="lab">Quote <span class="hint">highlighted text, optional</span></span>
      <textarea id="quote" rows="3" placeholder="Select text on the page before opening this to quote it."></textarea>
    </label>

    <label class="field">
      <span class="lab">Title</span>
      <input id="title" type="text" required>
    </label>

    <div class="row">
      <label class="field grow">
        <span class="lab">Link</span>
        <input id="link" type="url" required>
      </label>
      <label class="field source">
        <span class="lab">Source</span>
        <input id="source" type="text">
      </label>
    </div>

    <div class="actions">
      <button type="button" id="draft" class="secondary">Save as draft</button>
      <button type="submit" id="publish" class="primary">Publish <kbd>⌘↵</kbd></button>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
