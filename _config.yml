title: "Wildfiring"
author: "Jeremy Wildfire"
description: "Jeremy Wildfire builds open-source software for clinical trials. Modernizing clinical trials with AI and open source." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# Shown under the wordmark in the homepage rail and in the footer on other pages.
tagline: "Modernizing clinical trials with AI and open source."

# Dates and permalinks use Eastern time. GitHub Pages builds in UTC, so without this
# a quick hit posted in the evening got the next day's date and URL, and the link the
# Chrome extension copies (worked out in local time) pointed at a page that wasn't there.
timezone: America/New_York

# Linked from the rail, the site footer, and post pages.
cv_url: "https://github.com/jwildfire/cv"
scholar_url: "https://scholar.google.com/citations?user=Hn0AnpIAAAAJ"

# Pages listed in the header nav on posts and interior pages (order matters).
header_pages:
  - projects.html
  - links.html
  - archive.md

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "jwildfire@gmail.com"
twitter_username: "jwildfire"
github_username: "jwildfire"
linkedin_username: "jeremy-wildfire"

# Cloudflare Web Analytics beacon token (dash.cloudflare.com > Web Analytics >
# add site > copy the token from the JS snippet). Leave empty to disable.
cloudflare_web_analytics: "467f55bd2cc54185b9027ed877e09d22"


#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Quick hits: one file per shared link in _links/, named YYYY-MM-DD-slug.md and
# usually written by the Chrome extension in scripts/quick-hit/. Front matter holds
# title, link (the page shared), source, and an optional quote; the body is the
# comment. They show in the homepage News feed, on /links/, and at /feed/links.xml.
collections:
  links:
    output: true
    permalink: /links/:year/:month/:day/:title/

feed:
  collections:
    links:
      path: "/feed/links.xml"

# Not part of the site: build tooling for the release feed (see .github/workflows).
exclude:
  - scripts
  - AGENTS.md

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other
  - scope:
      path: ""
      type: links
    values:
      layout: link
  # The extended deck (every reserve slide) is shared by URL only: keep it out of the sitemap.
  # keynote.html, the talk deck, is linked from the annotated post and /keynote, so it is listed.
  - scope:
      path: "keynote/keynote_extended.html"
    values:
      sitemap: false
